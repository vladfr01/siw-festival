#le istruzioni che lo zio tuttofare usa per collegare la casa alla cantina

spring.application.name=siw-festival

#connessione al database
spring.datasource.url=jdbc:postgresql://localhost:5432/festival
spring.datasource.username=postgres
spring.datasource.password=postgres

#JPA: ricrea le tabelle a ogni avvio e mostra le qeury SQL in console
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

#Thymeleaf: niente cache, cosi vedi subito le modifiche alle pagine
spring.thymeleaf.cache=false
