#le istruzioni che lo zio tuttofare usa per collegare la casa alla cantina

spring.application.name=siw-festival

#connessione al database
spring.datasource.url=jdbc:postgresql://localhost:5432/festival
spring.datasource.username=postgres
spring.datasource.password=postgres

#JPA: ricrea le tabelle a ogni avvio e mostra le qeury SQL in console
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

#Thymeleaf: niente cache, cosi vedi subito le modifiche alle pagine
spring.thymeleaf.cache=false

#Perché serve: il campo data del browser spedisce le date nel formato internazionale, 2025-08-27. Spring invece, essendo il computer in italiano, si aspetterebbe un formato tipo 27/08/25, e non riuscirebbe a leggerle. Questa riga gli dice: "le date usale sempre nel formato internazionale (ISO)".
spring.mvc.format.date=iso
#Come quella sopra a questa ma per data E TEMPO
spring.mvc.format.date-time=iso
